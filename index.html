
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎧 Ouça e Soletre – 3 Fases</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #0d1b2a 0%, #1b2f4a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-card {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 40px;
      padding: 24px 22px 20px;
      box-shadow: 0 30px 50px -12px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.05);
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 2rem;
      color: #f2e9d0;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    h1 span {
      background: #f7c948;
      color: #1b2a49;
      font-size: 1.7rem;
      padding: 0 16px;
      border-radius: 60px;
    }

    .subhead {
      text-align: center;
      color: #b6c9e8;
      font-size: 0.85rem;
      letter-spacing: 1px;
      border-bottom: 1px dashed rgba(255,215,100,0.2);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .top-stats {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(10,20,40,0.5);
      border-radius: 30px;
      padding: 8px 12px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,215,100,0.15);
    }

    .phase-badge {
      background: #2a3f5e;
      padding: 6px 14px;
      border-radius: 60px;
      font-weight: 700;
      color: #f7c948;
      font-size: 1rem;
      border: 2px solid #f7c948;
    }

    .score-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #101c30;
      padding: 4px 14px;
      border-radius: 60px;
      border: 2px solid #ffe484;
    }

    .score-box span {
      color: #ffe484;
      font-weight: 700;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ffe484;
      min-width: 2.2rem;
      text-align: center;
    }

    .progress-fase {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f1c30;
      padding: 4px 14px;
      border-radius: 60px;
      border: 2px solid #6fbf6f;
    }

    .progress-fase span,
    .progress-fase strong {
      color: #6fbf6f;
      font-weight: 700;
    }

    .progress-fase strong {
      font-size: 1.2rem;
    }

    .timer-container {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f1c30;
      padding: 4px 12px;
      border-radius: 60px;
      border: 2px solid #5e7bb3;
    }

    .timer-container span {
      color: #8ba9dc;
      font-weight: 700;
    }

    .timer-display {
      font-size: 1.6rem;
      font-weight: 700;
      color: #8ba9dc;
      min-width: 2rem;
      text-align: center;
      font-family: 'Courier New', monospace;
    }

    .timer-display.warning {
      color: #ff6b6b;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    .timer-display.idle {
      color: #5d7499;
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.5; }
    }

    .word-box {
      display: none;
    }

    .listen-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 14px;
    }

    .btn-listen {
      background: #1f334f;
      border-radius: 60px;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0e9d0;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 6px 0 #0b1422;
      border: 2px solid #5e78a0;
      transition: 0.15s;
    }

    .btn-listen:hover {
      background: #2a4062;
    }

    .btn-listen:active {
      transform: translateY(3px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 10px 0 6px;
    }

    #palavraInput {
      width: 100%;
      max-width: 420px;
      padding: 14px 20px;
      border-radius: 60px;
      border: 2px solid #3d5a7a;
      background: #0a1628;
      color: white;
      font-size: 1.3rem;
      letter-spacing: 2px;
      text-align: center;
      outline: none;
      font-family: 'Courier New', monospace;
    }

    #palavraInput:focus {
      border-color: #f7c948;
      background: #0f1f38;
    }

    #palavraInput::placeholder {
      color: #5d7499;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-primary {
      background: #f7c948;
      border-radius: 60px;
      padding: 11px 28px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #141f33;
      box-shadow: 0 6px 0 #a57c2a;
      cursor: pointer;
      border: 1px solid #ffe28a;
    }

    .btn-primary:hover {
      background: #ffd966;
    }

    .btn-secondary {
      background: #2f405e;
      border-radius: 60px;
      padding: 11px 24px;
      font-weight: 600;
      font-size: 1rem;
      color: #d6e2ff;
      box-shadow: 0 6px 0 #192234;
      cursor: pointer;
      border: 1px solid #556f94;
    }

    .btn-secondary:hover {
      background: #3c5277;
      color: white;
    }

    .feedback {
      min-height: 3rem;
      margin: 12px 0 4px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      background: rgba(0,0,0,0.3);
      padding: 8px 14px;
      color: #cddefa;
      border: 1px solid #43587a;
      text-align: center;
    }

    .feedback.acerto {
      background: #1f4d2ecc;
      color: #b3f0b3;
      border-color: #6fbf6f;
    }

    .feedback.erro {
      background: #4d2525cc;
      color: #ffbaba;
      border-color: #bf6f6f;
    }

    .feedback.fim {
      background: #1f3d5ccc;
      color: #d4e6ff;
      border-color: #7a9fd4;
    }

    .feedback.tempo {
      background: #5a3d1fcc;
      color: #ffd99b;
      border-color: #bf8f4f;
    }

    .footer-credits {
      text-align: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,215,100,0.15);
      color: #7a8fa8;
      font-size: 0.8rem;
    }

    .footer-credits span {
      color: #f7c948;
    }

    @media (max-width: 600px) {
      .game-card {
        padding: 16px 12px;
        border-radius: 28px;
      }

      h1 {
        font-size: 1.5rem;
      }

      h1 span {
        font-size: 1.3rem;
      }

      .top-stats {
        flex-direction: column;
        align-items: stretch;
      }

      .phase-badge,
      .score-box,
      .progress-fase,
      .timer-container {
        justify-content: center;
      }

      .btn-listen {
        padding: 12px 22px;
        font-size: 1rem;
      }

      #palavraInput {
        font-size: 1.1rem;
      }

      .btn-primary,
      .btn-secondary {
        padding: 10px 18px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>
  <div class="game-card">

    <h1><span>🎧</span> Ouça &amp; Soletre</h1>

    <div class="subhead">
      ⭐ 3 fases • palavras médias e difíceis
    </div>

    <div class="top-stats">
      <div class="phase-badge" id="faseBadge">🌙 Fase 1</div>

      <div class="score-box">
        <span>🏆</span>
        <span class="score-value" id="scoreDisplay">0</span>
      </div>

      <div class="progress-fase">
        <span>📊</span>
        <strong id="progressText">0/30</strong>
      </div>

      <div class="timer-container">
        <span>⏱️</span>
        <span class="timer-display idle" id="timerDisplay">10</span>
        <span>s</span>
      </div>
    </div>

    <div class="listen-hint">
      <button class="btn-listen" id="listenBtn">
        <span>🔊</span> Ouvir palavra
      </button>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="palavraInput"
        placeholder="Digite a palavra..."
        autocomplete="off"
        disabled
      >

      <div class="actions">
        <button class="btn-primary" id="checkBtn" disabled>
          ✓ Verificar
        </button>

        <button class="btn-secondary" id="nextBtn">
          ↺ Próxima
        </button>
      </div>
    </div>

    <div class="feedback" id="feedbackMessage">
      💡 Clique em "Ouvir palavra"
    </div>

    <div class="footer-credits">
      Site desenvolvido por <span>Laércio Torquato</span>
    </div>

  </div>

  <script>
    (() => {
      // =========================================
      // BANCO DE PALAVRAS
      // =========================================

      const WORD_POOL = [
        "razoável", "garçom", "açougue", "exceção", "extinção",
        "hipótese", "sensação", "experimentar", "decisão", "interesse",
        "faxina", "espichar", "hospedar", "hesitar", "posse",
        "versão", "enxergar", "colchão", "chacoalhar", "incandescer",
        "atravessar", "superstição", "sentar", "cochichar", "cochilar",
        "capricho", "puxar", "anestesia", "consciente", "compressor",
        "extensão", "convenção", "ranzinza", "persuasão", "rabicho",
        "expertise", "hematoma", "agasalho", "fluorescente", "vexame",
        "obsceno", "anseio", "grosseiro", "excitar", "similar",
        "enxurrada", "inexorável", "admirar", "sinestesia", "exaurir",
        "reminiscência", "excrescência", "discrepância", "interstício",
        "extravasar", "extrair", "excêntrico", "ascensão",
        "discernimento", "fascinado", "perspicaz", "rescisão",
        "imprescindível", "sensibilizar", "expressivo", "fracasso",
        "esporádico", "exagerado", "demasiado", "disseminar",
        "exasperar", "assédio"
      ];

      // =========================================
      // CONFIGURAÇÃO DAS FASES
      // =========================================

      const PHASES = [
        { fase: 1, palavras: 30, meta: 20, label: "🌙 Fase 1" },
        { fase: 2, palavras: 30, meta: 20, label: "🌞 Fase 2" },
        { fase: 3, palavras: 30, meta: 25, label: "🌟 Fase 3" }
      ];

      const TEMPO_LIMITE = 10;

      // =========================================
      // ESTADO DO JOGO
      // =========================================

      let currentPhaseIndex = 0;
      let currentWordList = [];
      let currentWordIndex = 0;
      let score = 0;
      let totalAttempted = 0;
      let isAnswered = false;
      let isListening = false;
      let gameFinished = false;
      let timerInterval = null;
      let timeLeft = TEMPO_LIMITE;
      let timerStarted = false;
      let speechRequestId = 0;
      let advanceTimeout = null;

      // =========================================
      // ELEMENTOS DA INTERFACE
      // =========================================

      const scoreDisplay = document.getElementById("scoreDisplay");
      const faseBadge = document.getElementById("faseBadge");
      const progressText = document.getElementById("progressText");
      const palavraInput = document.getElementById("palavraInput");
      const checkBtn = document.getElementById("checkBtn");
      const nextBtn = document.getElementById("nextBtn");
      const listenBtn = document.getElementById("listenBtn");
      const feedbackEl = document.getElementById("feedbackMessage");
      const timerDisplay = document.getElementById("timerDisplay");

      // =========================================
      // FEEDBACK
      // =========================================

      function setFeedback(message, type = "info") {
        feedbackEl.textContent = message;
        feedbackEl.className = "feedback";

        if (type === "acerto") {
          feedbackEl.classList.add("acerto");
        } else if (type === "erro") {
          feedbackEl.classList.add("erro");
        } else if (type === "fim") {
          feedbackEl.classList.add("fim");
        } else if (type === "tempo") {
          feedbackEl.classList.add("tempo");
        }
      }

      // =========================================
      // FUNÇÕES AUXILIARES
      // =========================================

      function normalizeText(text) {
        return text
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim();
      }

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }

        return arr;
      }

      function generateWordListForPhase(phaseIndex) {
        const shuffled = shuffleArray([...WORD_POOL]);
        const count = PHASES[phaseIndex].palavras;

        while (shuffled.length < count) {
          shuffled.push(...shuffleArray([...WORD_POOL]));
        }

        return shuffled.slice(0, count);
      }

      // =========================================
      // CRONÔMETRO
      // =========================================

      function clearTimer() {
        if (timerInterval !== null) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        timerDisplay.classList.remove("warning");
      }

      function updateTimerDisplay() {
        timerDisplay.textContent = timeLeft;
      }

      function resetTimer() {
        clearTimer();

        timeLeft = TEMPO_LIMITE;
        timerStarted = false;

        updateTimerDisplay();

        timerDisplay.classList.remove("warning");
        timerDisplay.classList.add("idle");
      }

      function startTimer() {
        if (gameFinished || isAnswered || timerInterval !== null) {
          return;
        }

        if (timeLeft <= 0) {
          timeLeft = TEMPO_LIMITE;
        }

        timerStarted = true;
        timerDisplay.classList.remove("idle");

        updateTimerDisplay();

        timerInterval = setInterval(() => {
          if (gameFinished || isAnswered) {
            clearTimer();
            return;
          }

          // O tempo não é consumido enquanto o áudio toca.
          if (isListening) {
            return;
          }

          timeLeft--;
          updateTimerDisplay();

          if (timeLeft <= 3) {
            timerDisplay.classList.add("warning");
          }

          if (timeLeft <= 0) {
            clearTimer();
            handleTimeout();
          }
        }, 1000);
      }

      function stopTimer() {
        clearTimer();
      }

      // =========================================
      // ÁUDIO: PRONÚNCIA DA PALAVRA SELECIONADA
      // =========================================

      function handleListen() {
        if (gameFinished) {
          setFeedback("🏁 Jogo finalizado.", "fim");
          return;
        }

        if (isAnswered) {
          setFeedback("✅ Você já respondeu esta palavra.", "info");
          return;
        }

        if (isListening) {
          setFeedback("⏳ Aguarde o áudio terminar.", "info");
          return;
        }

        if (
          !currentWordList.length ||
          currentWordIndex >= currentWordList.length
        ) {
          setFeedback("⚠️ Nenhuma palavra disponível.", "erro");
          return;
        }

        const word = currentWordList[currentWordIndex];

        if (!word) {
          setFeedback("⚠️ Não foi possível carregar a palavra.", "erro");
          return;
        }

        if (!("speechSynthesis" in window)) {
          setFeedback(
            "❌ Seu navegador não suporta a reprodução de áudio.",
            "erro"
          );
          return;
        }

        speakWord(word);
      }

      function speakWord(word) {
        // Identificador para impedir que áudios antigos interfiram
        // na palavra atual.
        const requestId = ++speechRequestId;

        window.speechSynthesis.cancel();

        isListening = true;
        listenBtn.disabled = true;
        palavraInput.disabled = true;
        checkBtn.disabled = true;

        setFeedback("🔊 Preparando o áudio...", "info");

        // Aguarda o cancelamento da fala anterior.
        setTimeout(() => {
          if (requestId !== speechRequestId) {
            return;
          }

          if (gameFinished || isAnswered) {
            isListening = false;
            listenBtn.disabled = gameFinished || isAnswered;
            return;
          }

          const utterance = new SpeechSynthesisUtterance(word);

          // A palavra enviada ao sintetizador é exatamente a do banco.
          utterance.text = word;
          utterance.lang = "pt-BR";
          utterance.rate = 0.75;
          utterance.pitch = 1;
          utterance.volume = 1;

          // Prioriza uma voz brasileira quando disponível.
          const voices = window.speechSynthesis.getVoices();

          const ptVoice = voices.find(
            voice => voice.lang.toLowerCase() === "pt-br"
          );

          if (ptVoice) {
            utterance.voice = ptVoice;
          }

          utterance.onstart = () => {
            if (requestId !== speechRequestId) {
              return;
            }

            isListening = true;

            setFeedback("🔊 Ouvindo a palavra...", "info");
          };

          utterance.onend = () => {
            if (requestId !== speechRequestId) {
              return;
            }

            isListening = false;

            if (gameFinished || isAnswered) {
              listenBtn.disabled = true;
              return;
            }

            palavraInput.disabled = false;
            checkBtn.disabled = false;
            listenBtn.disabled = false;

            setFeedback("✅ Áudio finalizado. Digite a palavra.", "info");

            if (!timerStarted) {
              startTimer();
            }

            palavraInput.focus();
          };

          utterance.onerror = (event) => {
            if (requestId !== speechRequestId) {
              return;
            }

            isListening = false;

            if (event.error === "canceled" ||
                event.error === "interrupted") {
              return;
            }

            listenBtn.disabled = false;
            palavraInput.disabled = true;
            checkBtn.disabled = true;

            setFeedback(
              "⚠️ Falha no áudio. Clique em Ouvir palavra novamente.",
              "erro"
            );
          };

          window.speechSynthesis.speak(utterance);

        }, 200);
      }

      function cancelSpeech() {
        speechRequestId++;
        isListening = false;

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      }

      // =========================================
      // TEMPO ESGOTADO
      // =========================================

      function handleTimeout() {
        if (gameFinished || isAnswered) {
          return;
        }

        isAnswered = true;
        cancelSpeech();

        palavraInput.disabled = true;
        checkBtn.disabled = true;
        listenBtn.disabled = true;

        const correctWord = currentWordList[currentWordIndex];

        setFeedback(
          `⏰ Tempo esgotado! A palavra era: "${correctWord}"`,
          "tempo"
        );

        totalAttempted++;

        clearTimeout(advanceTimeout);

        advanceTimeout = setTimeout(() => {
          if (!gameFinished) {
            handleNext();
          }
        }, 2000);

        updateProgress();
      }

      // =========================================
      // ATUALIZAÇÃO DA INTERFACE
      // =========================================

      function updateProgress() {
        const phase = PHASES[currentPhaseIndex];

        faseBadge.textContent = phase.label;
        scoreDisplay.textContent = score;
        progressText.textContent =
          `${Math.min(totalAttempted, phase.palavras)}/${phase.palavras}`;
      }

      function showCurrentWord() {
        if (gameFinished) {
          return;
        }

        if (
          !currentWordList.length ||
          currentWordIndex >= currentWordList.length
        ) {
          finishPhase();
          return;
        }

        isAnswered = false;

        cancelSpeech();
        resetTimer();

        palavraInput.value = "";
        palavraInput.disabled = true;
        palavraInput.style.borderColor = "#3d5a7a";

        checkBtn.disabled = true;
        listenBtn.disabled = false;

        setFeedback('🔊 Clique em "Ouvir palavra"', "info");

        updateProgress();
      }

      // =========================================
      // VERIFICAR RESPOSTA
      // =========================================

      function handleCheck() {
        if (gameFinished || isAnswered) {
          return;
        }

        if (isListening) {
          setFeedback("⏳ Aguarde o áudio terminar.", "info");
          return;
        }

        if (!timerStarted) {
          setFeedback('🔊 Clique em "Ouvir palavra" primeiro.', "info");
          return;
        }

        const userInput = palavraInput.value.trim();

        if (userInput === "") {
          setFeedback("✏️ Digite a palavra.", "erro");
          return;
        }

        const correctWord = currentWordList[currentWordIndex];

        if (normalizeText(userInput) === normalizeText(correctWord)) {
          clearTimer();

          score++;
          totalAttempted++;
          isAnswered = true;

          palavraInput.disabled = true;
          checkBtn.disabled = true;
          listenBtn.disabled = true;

          palavraInput.style.borderColor = "#6fbf6f";

          setFeedback(
            `🎉 ACERTOU! +1 ponto. Palavra: "${correctWord}"`,
            "acerto"
          );

          updateProgress();

          clearTimeout(advanceTimeout);

          advanceTimeout = setTimeout(() => {
            if (!gameFinished) {
              handleNext();
            }
          }, 1500);

        } else {
          setFeedback(
            "❌ Resposta incorreta. Tente novamente!",
            "erro"
          );

          palavraInput.style.borderColor = "#bf6f6f";
          palavraInput.value = "";

          // Reinicia os 10 segundos para uma nova tentativa.
          resetTimer();
          startTimer();

          palavraInput.focus();
        }
      }

      // =========================================
      // PRÓXIMA PALAVRA
      // =========================================

      function handleNext() {
        if (gameFinished) {
          return;
        }

        clearTimeout(advanceTimeout);
        clearTimer();
        cancelSpeech();

        // Se o aluno avançar sem responder, conta como tentativa.
        if (!isAnswered) {
          totalAttempted++;
        }

        isAnswered = true;

        const phase = PHASES[currentPhaseIndex];

        if (
          totalAttempted >= phase.palavras ||
          currentWordIndex >= currentWordList.length - 1
        ) {
          finishPhase();
          return;
        }

        currentWordIndex++;
        showCurrentWord();
      }

      // =========================================
      // FINALIZAÇÃO E MUDANÇA DE FASE
      // =========================================

      function finishPhase() {
        clearTimer();
        cancelSpeech();

        const phase = PHASES[currentPhaseIndex];

        updateProgress();

        palavraInput.disabled = true;
        checkBtn.disabled = true;
        listenBtn.disabled = true;

        if (score >= phase.meta) {
          if (currentPhaseIndex === PHASES.length - 1) {
            gameFinished = true;

            setFeedback(
              `🏆 Parabéns! Você concluiu as 3 fases! Última fase: ${score} acertos.`,
              "fim"
            );

            return;
          }

          currentPhaseIndex++;

          currentWordList = generateWordListForPhase(currentPhaseIndex);
          currentWordIndex = 0;
          score = 0;
          totalAttempted = 0;

          setFeedback(
            `🎉 Parabéns! Você passou para ${PHASES[currentPhaseIndex].label}!`,
            "acerto"
          );

          updateProgress();
          showCurrentWord();

        } else {
          // Mantém a regra original: quem não alcança a meta
          // precisa começar novamente pela Fase 1.
          currentPhaseIndex = 0;

          currentWordList = generateWordListForPhase(0);
          currentWordIndex = 0;
          score = 0;
          totalAttempted = 0;

          setFeedback(
            `❌ Você não alcançou a meta de ${phase.meta} acertos. Voltando à Fase 1.`,
            "erro"
          );

          updateProgress();
          showCurrentWord();
        }
      }

      // =========================================
      // INICIALIZAÇÃO
      // =========================================

      function initGame() {
        cancelSpeech();
        clearTimer();
        clearTimeout(advanceTimeout);

        currentPhaseIndex = 0;
        currentWordList = generateWordListForPhase(0);
        currentWordIndex = 0;

        score = 0;
        totalAttempted = 0;
        isAnswered = false;
        gameFinished = false;
        timerStarted = false;

        palavraInput.value = "";
        palavraInput.disabled = true;

        checkBtn.disabled = true;
        listenBtn.disabled = false;

        updateProgress();
        showCurrentWord();

        setFeedback(
          '🎧 Clique em "Ouvir palavra" para começar.',
          "info"
        );

        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
        }
      }

      // =========================================
      // EVENTOS
      // =========================================

      listenBtn.addEventListener("click", handleListen);

      checkBtn.addEventListener("click", handleCheck);

      nextBtn.addEventListener("click", handleNext);

      palavraInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();

          if (!checkBtn.disabled) {
            handleCheck();
          }
        }
      });

      // Inicia o jogo automaticamente ao carregar a página.
      initGame();

    })();
  </script>
</body>
</html>
